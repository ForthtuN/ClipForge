<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <rect width="1200" height="520" rx="28" fill="#0b1020"/>
  <text x="58" y="65" fill="#f7f8fc" font-family="Segoe UI, Arial" font-size="32" font-weight="700">Test current frame</text>
  <text x="58" y="101" fill="#9ca9c3" font-family="Segoe UI, Arial" font-size="18">See what ClipForge searches for, where it searches, and whether it matched.</text>
  <rect x="58" y="140" width="320" height="260" rx="18" fill="#121a2c" stroke="#5a4a16"/>
  <circle cx="84" cy="174" r="7" fill="#ffc107"/>
  <text x="104" y="181" fill="#fff" font-family="Segoe UI, Arial" font-size="18" font-weight="700">REFERENCE PREVIEW</text>
  <rect x="84" y="211" width="268" height="126" rx="12" fill="#080b12" stroke="#ffc107" stroke-width="2"/>
  <text x="218" y="285" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, Arial" font-size="28" font-weight="800">HEADSHOT</text>
  <text x="84" y="371" fill="#aeb9cf" font-family="Segoe UI, Arial" font-size="15">WHAT ClipForge searches for.</text>
  <rect x="440" y="140" width="320" height="260" rx="18" fill="#121a2c" stroke="#21485e"/>
  <circle cx="466" cy="174" r="7" fill="#38bdf8"/>
  <text x="486" y="181" fill="#fff" font-family="Segoe UI, Arial" font-size="18" font-weight="700">SEARCH AREA PREVIEW</text>
  <rect x="466" y="211" width="268" height="126" rx="12" fill="#132132" stroke="#38bdf8" stroke-width="2"/>
  <rect x="525" y="245" width="150" height="48" rx="8" fill="#080b12" fill-opacity=".78"/>
  <text x="600" y="276" text-anchor="middle" fill="#f4f8fc" font-family="Segoe UI, Arial" font-size="20" font-weight="800">HEADSHOT</text>
  <text x="466" y="371" fill="#aeb9cf" font-family="Segoe UI, Arial" font-size="15">WHERE ClipForge searches.</text>
  <rect x="822" y="140" width="320" height="260" rx="18" fill="#121a2c" stroke="#32405b"/>
  <text x="850" y="181" fill="#fff" font-family="Segoe UI, Arial" font-size="18" font-weight="700">MATCH RESULT</text>
  <rect x="850" y="212" width="264" height="66" rx="12" fill="#10291f" stroke="#4ade80" stroke-width="2"/>
  <text x="982" y="254" text-anchor="middle" fill="#7ef3a4" font-family="Segoe UI, Arial" font-size="28" font-weight="800">TRUE</text>
  <text x="850" y="322" fill="#d8deea" font-family="Segoe UI, Arial" font-size="18">Similarity</text>
  <text x="1114" y="322" text-anchor="end" fill="#fff" font-family="Segoe UI, Arial" font-size="18" font-weight="700">96%</text>
  <text x="850" y="356" fill="#d8deea" font-family="Segoe UI, Arial" font-size="18">Threshold</text>
  <text x="1114" y="356" text-anchor="end" fill="#fff" font-family="Segoe UI, Arial" font-size="18" font-weight="700">90%</text>
  <rect x="58" y="430" width="1084" height="52" rx="12" fill="#141b2d"/>
  <text x="600" y="463" text-anchor="middle" fill="#b8c3d8" font-family="Segoe UI, Arial" font-size="17">Test frames that SHOULD match and frames that SHOULD NOT match before saving.</text>
</svg>
